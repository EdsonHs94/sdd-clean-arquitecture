schema: spec-driven

context: |
  This is an existing Python backend built with FastAPI and Spec-Driven Development.
  Extend its pragmatic Clean / Hexagonal Architecture with domain, application,
  infrastructure, and presentation layers. Dependencies point inward:
  application depends on domain; infrastructure and presentation depend on
  application/domain. Keep domain and application independent of FastAPI,
  Pydantic, SQLAlchemy, PostgreSQL clients, boto3/AWS, and PyJWT.
  Define narrow ports with Python Protocol in the inner layers; infrastructure
  implements them. Use constructor dependency injection in application code and
  FastAPI Depends at the presentation/composition boundary. Wire concrete adapters
  in app/bootstrap.py and represent business operations as explicit use cases.
  Preserve the persistence stack: SQLAlchemy 2.x async, PostgreSQL with asyncpg,
  and Alembic migrations. Keep ORM models and persistence details in infrastructure.
  Use uv for dependency management and locked command execution, pytest for tests,
  and Ruff for linting and formatting.
  Develop business behavior through TDD: RED (confirm a failing behavioral test),
  GREEN (implement the minimum), then REFACTOR while keeping tests passing.
  Use fakes for stateful ports, mocks for external interactions, infrastructure
  integration tests, and API tests as appropriate. Verify acceptance criteria
  and inward dependency boundaries for each change.
  Reuse existing use-case, port, adapter, composition, error-handling, and testing
  patterns. Favor maintainability, testability, low coupling, explicit dependencies,
  and simple solutions; avoid generic services or abstractions without a concrete need.
  docs/requirements.md, docs/spec.md, docs/plan.md, and docs/tasks.md describe the
  original SDD implementation and remain its baseline reference.
  For each new change, its approved OpenSpec artifacts are the source of truth
  for scope, behavior, design, and implementation tasks. Consult relevant docs/
  for existing contracts and constraints; explicitly document any intended change
  to that baseline in OpenSpec before implementation, without silently diverging.

# Project context (optional)
